spring.application.name=skillgap-ai-backend

# Loads application-local.properties for the actual DB connection details.
# That file is gitignored (see .gitignore) so real credentials never get
# committed - only this file, with no secrets in it, goes into git.
spring.profiles.active=local

# Let Hibernate create/update tables from our @Entity classes for now.
# Fine for local development; we are not using a fixed migration tool yet.
spring.jpa.hibernate.ddl-auto=update

# Print the generated SQL to the console - useful for a viva to show
# exactly what JPA is doing, not just trust it blindly.
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Phase 5: resume PDFs shouldn't need more than a few MB - keeps uploads
# bounded and gives a clear 413 instead of silently accepting anything.
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# Phase 6e: how long a JWT stays valid after login/signup. Not a secret
# (unlike jwt.secret, which lives in application-local.properties) so it's
# fine to commit.
jwt.expiration-ms=86400000

# Auth is entirely our own JWT filter (see security/), so Spring Security's
# in-memory UserDetailsService is never actually used - without this,
# Spring Boot still auto-configures one anyway and logs a random
# "generated security password" on every startup, which is just noise
# (and misleading - that password isn't part of any real login path).
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
